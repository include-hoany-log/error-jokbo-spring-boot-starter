plugins {
    id 'java-library'
}

group = 'io.github.include-hoany-log'
version = '0.0.1-SNAPSHOT'


java {
    sourceCompatibility = JavaVersion.VERSION_17
}


repositories {
    mavenCentral()
}

dependencies {

    compileOnly 'org.springframework.boot:spring-boot-starter-web:3.2.0'
    compileOnly 'org.springframework.boot:spring-boot-configuration-processor:3.2.0'
    compileOnly 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.8'

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.named('test') {
    useJUnitPlatform()
}